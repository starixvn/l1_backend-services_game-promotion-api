variables:
  NODEJS_IMAGE: hub.lumigame.com/base/node:20.9.0-alpine

include:
  - project: 'ci/core-cicd'
    ref: main
    file: 'luminet.gitlab-ci.yml'

api_tests:
  image: hub.lumigame.com/base/node:22-alpine-25h1.1
  stage: .post # Runs within the deploy stage
  variables:
    TRANSFORM_CONFIG: $DEPLOY_ENV
    STACK_NAME: $STACK_NAME
  before_script:
    - cd api-testing
    - npm install
  script:
    - |
      set -e
      echo "--- Verifying variables ---"
      echo "TRANSFORM_CONFIG is: '$TRANSFORM_CONFIG'"
      echo "STACK_NAME is: '$STACK_NAME'"
      echo "---------------------------"
      node index.js